# sb4edge dev boot menu, on the stick's writable partition (edited over SSH).
# One-shot test boot: set next_entry=<n> in sb4dev/grubenv (grub-editenv); it is cleared before booting,
# so the following boot returns to entry 0. If GRUB cannot clear it, the one-shot is ignored.
set timeout=5
set default=0
set fallback="0 1"
search --no-floppy --label writable --set=w
search --no-floppy --file /casper/initrd-sb4edge --set=root
set cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
if [ -f ($w)/sb4dev/grubenv ]; then
    load_env -f ($w)/sb4dev/grubenv
    if [ -n "$next_entry" ]; then
        set ne="$next_entry"
        set next_entry=
        if save_env -f ($w)/sb4dev/grubenv next_entry; then set default="$ne"; fi
    fi
fi

menuentry "sb4 dev: ISO kernel + dev access (SSH, Tailscale)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz-sb4edge $cmdline --- quiet splash console=tty0 usbcore.autosuspend=-1
    initrd /casper/initrd-sb4edge ($w)/sb4dev/hook.cpio
}
menuentry "plain ISO boot (no dev hook)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz-sb4edge $cmdline --- quiet splash console=tty0 usbcore.autosuspend=-1
    initrd /casper/initrd-sb4edge
}
menuentry "sb4 test: writable/sb4dev/vmlinuz-test + dev access" {
    set gfxpayload=keep
    linux  ($w)/sb4dev/vmlinuz-test $cmdline panic=10 --- console=tty0 panic=10
    initrd /casper/initrd-sb4edge ($w)/sb4dev/hook.cpio
}
