# CAMSS exposes 16 raw V4L2 nodes, Qualcomm Camera Subsystem, that carry no usable image;
# apps enumerate them first and pick one. Hide their nodes so only the libcamera camera
# (Built-in Front Camera) is offered. Only the nodes: disabling the V4L2 devices as well
# also made the libcamera camera disappear from PipeWire.
# Keep double quotes out of these comments: WirePlumber 0.5 failed to parse the earlier
# version of this file (section has no value) and ignored it.
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "~v4l2_input.platform[-_]acb[0-9a-f]+[.]isp.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
