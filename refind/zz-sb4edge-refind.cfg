# sb4edge: rEFInd is the boot menu (it shows Ubuntu and Windows); GRUB boots Ubuntu straight away.
# Esc during boot still opens the GRUB menu (also after a failed boot: RECORDFAIL_TIMEOUT 0). Windows detection is left to rEFInd.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_DISABLE_OS_PROBER=true
GRUB_RECORDFAIL_TIMEOUT=0
