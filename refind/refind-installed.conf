# sb4edge-managed: rewritten by sb4edge-refind-install (delete this line to keep your own edits).
# rEFInd on the internal EFI partition (EFI/refind). Ubuntu chains to Ubuntu's shim/GRUB (menu hidden; kernel
# updates work as usual), Windows to Windows Boot Manager on the same partition.
timeout 5
# No default_selection: rEFInd starts on the last OS booted (first boot: Ubuntu, the first entry). It records that
# in EFI/refind/vars/PreviousBoot on the EFI partition instead of the firmware NVRAM (use_nvram false).
use_nvram false
# Also list bootable USB sticks / SD cards (their EFI/BOOT loader). "internal" is scanned too because some
# firmware reports SD cards as internal; the internal EFI partition (label SYSTEM, GPT name "EFI system partition")
# is excluded so Ubuntu/Windows don't appear twice. Only the top loader of a stick is shown (GRUB/MokManager/
# fallback files are skipped: shim or rEFInd in EFI/BOOT chains to them).
scanfor manual,external,internal
dont_scan_volumes LRS_ESP,SYSTEM,"EFI system partition"
# sb4edge live stick (EFI partition label SB4EDGE): boot its sb4live.efi (GRUB -> live session) directly instead
# of its own rEFInd (bootaa64.efi), which would show a second menu.
dont_scan_files +,grubaa64.efi,mmaa64.efi,fbaa64.efi,SB4EDGE:\EFI\boot\bootaa64.efi
include themes/sb4edge/theme.conf

menuentry "Ubuntu" {
    ostype Linux
    graphics on
    icon   \EFI\refind\themes\sb4edge\os_ubuntu.png
    loader \EFI\ubuntu\shimaa64.efi
}

# No "volume": Windows Boot Manager is on rEFInd's own partition. Selecting it by the GPT name "EFI system
# partition" could pick an external disk's EFI partition (names compare without case), and Windows did not start.
menuentry "Windows" {
    ostype Windows
    graphics on
    icon   \EFI\refind\themes\sb4edge\os_windows.png
    loader \EFI\Microsoft\Boot\bootmgfw.efi
}
