# rEFInd on the sb4edge live ISO/USB (EFI/boot/bootaa64.efi). Ubuntu chains to our GRUB (refind/build-grub.sh: silent early
# config; Ubuntu's signed ISO GRUB prints "error: file '/boot/' not found." first). "graphics on" keeps rEFInd's text
# banner away. GRUB applies the
# Snapdragon firmware workaround (cutmem) and boots the live kernel with its menu hidden (Esc shows it).
timeout 5
default_selection Ubuntu
scanfor manual
include themes/sb4edge/theme.conf

menuentry "Ubuntu" {
    ostype Linux
    graphics on
    icon   \EFI\boot\themes\sb4edge\os_ubuntu.png
    loader \EFI\boot\grubaa64.efi
}

# Windows Boot Manager is on the internal EFI partition, selected by its filesystem label SYSTEM. The GPT name
# "EFI system partition" also matches other disks' EFI partitions (names compare without case).
menuentry "Windows" {
    ostype Windows
    graphics on
    icon   \EFI\boot\themes\sb4edge\os_windows.png
    volume SYSTEM
    loader \EFI\Microsoft\Boot\bootmgfw.efi
}
