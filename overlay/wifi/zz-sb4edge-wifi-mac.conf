# sb4edge: ath12k (WCN7850) has no MAC in its board data, so the firmware makes up a new 00:03:7f:12:xx:xx
# every boot. Captive portals (hotel/hospital guest Wi-Fi) then treat the laptop as a new device and make you
# log in again. "stable": NetworkManager derives one address per network from this machine's secret key, the
# same at every boot. To pin one address instead, put it here (e.g. wifi.cloned-mac-address=02:12:34:56:78:9A).
[connection-sb4edge-wifi-mac]
match-device=driver:ath12k_wifi7_pci
wifi.cloned-mac-address=stable
