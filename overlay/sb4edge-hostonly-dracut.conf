# sb4edge: build the initramfs for this laptop only (the modules and firmware of the hardware present), 184 modules
# instead of ~2570: smaller image, read faster by the boot loader. Everything else loads from the root disk after
# boot. Rescue: hold Esc after choosing Ubuntu in rEFInd -> "Ubuntu (full initramfs, rescue)".
hostonly="yes"
hostonly_mode="strict"
