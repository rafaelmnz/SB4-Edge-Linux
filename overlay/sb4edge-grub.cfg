# Samsung Galaxy Book4 Edge: usbcore is built in, so its autosuspend can only be disabled here.
# drm.edid_firmware: the panel's EDID with an added 60 Hz mode (display/make-edid.py; the file is in the initramfs
# through /etc/dracut.conf.d/sb4edge-edid.conf). msm.psr_enabled is NOT set: msm PSR blanks/flickers on X1E.
# msm.vrr=3: variable refresh on the panel all the time (patches/sb4edge-local/0015): 120 Hz while anything
# moves, 48 Hz when the screen is static.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT usbcore.autosuspend=-1 drm.edid_firmware=eDP-1:edid/sb4edge-edid.bin msm.vrr=3"
