# Samsung Galaxy Book4 Edge internal microphones.
#
# Raw mics (UCM "Mic", MultiMedia4, hw:0,3): the ADSP topology's VA capture graph only starts with 4 channels:
# opened as stereo (PipeWire's default) the DSP rejects APM_CMD_GRAPH_START ("DSP returned error[1001002]",
# "Failed to start APM port 110") and the source never delivers a buffer. The mics are DMIC0 and DMIC1 on data
# line 0 (decimators 0/1 -> slots 0/1); slots 2/3 stay silent, so they are AUX channels, which PipeWire leaves
# out when an app records mono or stereo.
#
# Fluence (MultiMedia8, hw:0,7) is not a UCM device (PipeWire's UCM profiles would make it exclusive with "Mic"):
# it is a plain ALSA source added by sb4edge-fluence-source.service (user) once the card exists.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*HiFi__Mic__source" }
      # Fallback: the internal-mic PCM is hw:0,3 (hw:0,2 is the headset mic, hw:0,7 Fluence).
      { api.alsa.pcm.device = "3", api.alsa.pcm.stream = "capture" }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        audio.position = [ FL FR AUX0 AUX1 ]
      }
    }
  }
]
