# Noise suppression for the Galaxy Book4 Edge internal microphones (WebRTC, as Windows does in the ADSP).
# With the VA decimators at +32 dB (UCM HiFi.conf) speech peaks around -24 dBFS, but the DMICs' own noise sits at
# about -51 dBFS: an audible hiss. This adds "Microphone (noise suppression)", fed from the internal mics, with
# WebRTC noise suppression, high-pass filter and echo cancellation against the speakers (monitor mode: no extra
# output device), and makes it the default input. The raw "Internal microphones" source stays selectable, and a
# headset mic can be picked in Settings as before.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "capture.sb4edge_mic_ns"
        target.object = "alsa_input.platform-sound.HiFi__Mic__source"
        node.passive = true
        node.dont-reconnect = false
      }
      source.props = {
        node.name = "sb4edge_mic_ns"
        node.description = "Microphone (noise suppression)"
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
]
