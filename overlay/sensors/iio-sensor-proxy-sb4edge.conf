# iio-sensor-proxy built with Qualcomm SSC support (Ubuntu's is built without), reading the ambient light sensor through
# the ADSP sensors domain. The light sensor is published as data type "color" (VEML3328), not "ambient_light".
[Unit]
Wants=sb4edge-sensors.service
After=sb4edge-sensors.service

[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/sb4edge/ssc LIBSSC_LIGHT_DATA_TYPE=color
RestrictAddressFamilies=AF_QIPCRTR
# The sensor is published a few seconds after the ADSP sensors domain gets its registry: wait for it (up to a minute),
# since iio-sensor-proxy looks for sensors only once, at start.
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do /usr/lib/sb4edge/ssc/ssccli --sensor light --timeout 1 >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0'
ExecStart=
ExecStart=/usr/lib/sb4edge/ssc/iio-sensor-proxy
