# sb4edge: load the QRTR transport in the initramfs before the ADSP/CDSP boot. Loaded after the CDSP came up, its
# channel open once timed out inside modprobe (5 s, "failed to create endpoint" -12) and stalled every driver behind
# it, the display too. Registered first, the channel probe runs later in the glink worker and blocks no module load.
# (Force-loading the display chain - msm, panel, phys - gained nothing and the boot splash never appeared: not used.)
force_drivers+=" qrtr qrtr_smd "
