# sb4edge: Adreno X1-85 (gen70500) microcode. msm probes in the initramfs; without these it logs
# "failed to load gen70500_sqe.fw" and only brings the GPU up after the switch to the real root.
install_items+=" /usr/lib/firmware/qcom/gen70500_sqe.fw.zst /usr/lib/firmware/qcom/gen70500_gmu.bin.zst "
