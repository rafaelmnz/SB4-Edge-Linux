# sb4edge: the initramfs carried every Snapdragon laptop's ADSP/CDSP firmware (Lenovo, Dell, HP, ASUS: ~40 MB of
# already-compressed files) because ubuntu-x1e-settings copies all of qcom/x1e80100. The boot loader reads the whole
# image before the kernel starts, so it lengthened the black screen after rEFInd. Keep the generic and Samsung files.
remove_items+=" /usr/lib/firmware/qcom/x1e80100/ASUSTeK /usr/lib/firmware/qcom/x1e80100/dell /usr/lib/firmware/qcom/x1e80100/hp /usr/lib/firmware/qcom/x1e80100/LENOVO /usr/lib/firmware/qcom/x1p42100 /usr/lib/firmware/ath12k/QCN9274 /usr/lib/firmware/ath12k/IPQ5424 /usr/lib/firmware/ath12k/QCC2072 "
