<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- sb4edge: fingerprint identification at the GDM user chooser (sb4edge-fp-identify) -->
<busconfig>
  <policy user="root">
    <allow own="org.sb4edge.FingerprintIdentify"/>
    <allow send_destination="org.sb4edge.FingerprintIdentify"/>
  </policy>
  <policy group="gdm">
    <allow send_destination="org.sb4edge.FingerprintIdentify" send_interface="org.sb4edge.FingerprintIdentify"/>
    <allow send_destination="org.sb4edge.FingerprintIdentify" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.sb4edge.FingerprintIdentify"/>
  </policy>
</busconfig>
