# sb4edge: boot the newest -sb4edge kernel by default. Ubuntu's own kernels lack the Galaxy Book4 Edge patches,
# and on a rolling system a newer Ubuntu kernel would otherwise become the default.
K=$(ls /boot/vmlinuz-*-sb4edge 2>/dev/null | sed "s|^/boot/vmlinuz-||" | sort -V | tail -n1)
[ -n "$K" ] && GRUB_DEFAULT="Advanced options for Ubuntu>Ubuntu, with Linux $K"
